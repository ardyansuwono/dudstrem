version: "3.9"

services:
  # ── Cobalt API (media processor) ────────────────────────────────────────────
  cobalt-api:
    image: ghcr.io/imputnet/cobalt:latest
    container_name: cobalt_api
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      API_URL: "http://cobalt-api:9000/"
      CORS_WILDCARD: "1"
      # Uncomment to require API key auth:
      # API_KEY_URL: "file:///keys.json"
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # ── Telegram Bot ──────────────────────────────────────────────────────────
  telegram-bot:
    build: .
    container_name: cobalt_bot
    restart: unless-stopped
    depends_on:
      - cobalt-api
    environment:
      BOT_TOKEN: "${BOT_TOKEN}"
      COBALT_API_URL: "http://cobalt-api:9000"
      # For local dev, leave WEBHOOK_URL unset → uses long polling
      # WEBHOOK_URL: "https://your-domain.com"
      # COBALT_API_KEY: ""  # leave empty if not using API key auth
    ports:
      - "3000:3000"
